<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車輛交收與損壞申報系統 (Fleet Check-in)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging-compat.js"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .tear-card {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
            transform-origin: top center;
        }
        .tear-animation {
            transform: translateY(120px) rotate(12deg) scale(0.9);
            opacity: 0;
            pointer-events: none;
        }
        .paper-stack {
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06), 0 10px 15px -3px rgba(0,0,0,0.1);
            background: repeating-linear-gradient(#fff, #fff 28px, #e2e8f0 29px);
        }
        .car-zone { transition: all 0.18s ease; cursor: pointer; }
        .car-zone:hover { fill: rgba(59, 130, 246, 0.3); }
        .car-zone.active-damage { fill: rgba(239, 68, 68, 0.65); stroke: #b91c1c; stroke-width: 2.5px; }
        .paste-zone { transition: all 0.2s ease; border: 2px dashed #cbd5e1; }
        .paste-zone:hover, .paste-zone.dragover { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- 用於無刷新跨網域上傳照片至 Google Drive 的隱藏 Iframe 與 Form -->
    <iframe name="hidden_upload_iframe" id="hidden_upload_iframe" class="hidden"></iframe>
    <form id="gas-upload-form" method="POST" target="hidden_upload_iframe" class="hidden">
        <input type="hidden" name="folderName" id="gas-folderName">
    </form>

    <!-- Header Navbar -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg"><i data-lucide="truck" class="w-6 h-6 text-white"></i></div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight">車輛交收與損壞申報系統</h1>
                    <p class="text-xs text-slate-400">New Tech Motor Engineering Limited</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="switchTab('notebook')" id="nav-notebook-btn" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-blue-600 text-white transition">今日行程記事簿</button>
                <button onclick="switchTab('driver')" id="nav-driver-btn" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">自訂申報端</button>
                <button onclick="switchTab('admin')" id="nav-admin-btn" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">主管後台端</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6">

        <!-- ==================== 第一頁：撕紙記事本 (今日 Order) ==================== -->
        <section id="view-notebook" class="space-y-6">
            <div class="flex items-center justify-between border-b border-slate-200 pb-4">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <i data-lucide="book-open" class="w-6 h-6 text-blue-600"></i> 今日派單記事簿
                    </h2>
                    <p class="text-xs text-slate-500 mt-1">請選擇預設 Order，點擊接單並進行交收申報。</p>
                </div>
                <button onclick="requestNotificationPermission()" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold rounded-lg flex items-center gap-1.5 transition">
                    <i data-lucide="bell" class="w-4 h-4"></i> 開啟手機新單推送通知
                </button>
            </div>

            <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- 動態載入 Order 卡片 -->
            </div>
        </section>

        <!-- ==================== 員工申報端 (第二頁/自動帶入) ==================== -->
        <section id="view-driver" class="space-y-6 hidden">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="border-b border-slate-100 pb-4 mb-6">
                    <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <i data-lucide="clipboard-pen-line" class="w-5 h-5 text-blue-600"></i> 車輛交收與事故申報表
                    </h2>
                    <p class="text-sm text-slate-500 mt-1">確認派單資料或選擇手動申報。</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <button type="button" onclick="setCategory(1)" id="cat-btn-1" class="p-4 rounded-xl border-2 border-blue-600 bg-blue-50 text-blue-900 font-bold flex items-center justify-center gap-3 transition">
                        <i data-lucide="clipboard-check" class="w-6 h-6 text-blue-600"></i>
                        <span class="text-base">第 1 類：日常交收車輛申報表</span>
                    </button>
                    <button type="button" onclick="setCategory(2)" id="cat-btn-2" class="p-4 rounded-xl border-2 border-slate-200 bg-slate-50 text-slate-600 font-bold flex items-center justify-center gap-3 transition">
                        <i data-lucide="alert-triangle" class="w-6 h-6 text-red-500"></i>
                        <span class="text-base">第 2 類：車輛損壞申報表</span>
                    </button>
                </div>

                <form id="report-form" onsubmit="submitReport(event)" class="space-y-6">
                    <div id="cat1-fields" class="space-y-6">
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-2">
                                <i data-lucide="file-text" class="w-4 h-4 text-blue-600"></i> 第一部分：基本資訊
                            </h3>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">T牌號碼 *</label>
                                    <select id="cat1-t-plate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                        <option value="">-- 請選擇 T 牌 --</option>
                                        <option value="T15195">T15195</option>
                                        <option value="T11835">T11835</option>
                                        <option value="T10559">T10559</option>
                                        <option value="T13012">T13012</option>
                                        <option value="T13013">T13013</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">司機/員工姓名 *</label>
                                    <select id="cat1-driver-select" onchange="toggleCustomOption('cat1-driver-select', 'cat1-driver-custom')" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                        <option value="">-- 請選擇司機/員工 --</option>
                                        <option value="林國枝">林國枝</option>
                                        <option value="鄭偉倫">鄭偉倫</option>
                                        <option value="黃家鑑">黃家鑑</option>
                                        <option value="林耀銓">林耀銓</option>
                                        <option value="other">其他 (手動輸入)</option>
                                    </select>
                                    <input type="text" id="cat1-driver-custom" placeholder="請輸入全名" class="w-full mt-2 px-3 py-2 border border-slate-300 rounded-lg text-sm hidden">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">客人 / 部門</label>
                                    <select id="cat1-dept-select" onchange="toggleCustomOption('cat1-dept-select', 'cat1-dept-custom')" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                        <option value="">-- 請選擇客人 / 部門 --</option>
                                        <option value="警務處">警務處</option>
                                        <option value="消防處">消防處</option>
                                        <option value="懲教署">懲教署</option>
                                        <option value="機電工程署">機電工程署</option>
                                        <option value="博愛醫院">博愛醫院</option>
                                        <option value="other">其他 (手動輸入)</option>
                                    </select>
                                    <input type="text" id="cat1-dept-custom" placeholder="例如：工程部" class="w-full mt-2 px-3 py-2 border border-slate-300 rounded-lg text-sm hidden">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">品牌 *</label>
                                    <select id="cat1-brand-select" onchange="toggleBrandCustom('cat1')" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                        <option value="">-- 請選擇品牌 --</option>
                                        <option value="三菱">三菱</option>
                                        <option value="豐田">豐田</option>
                                        <option value="other">其他 (手動輸入)</option>
                                    </select>
                                    <input type="text" id="cat1-brand-custom" placeholder="請輸入品牌" class="w-full mt-2 px-3 py-2 border border-slate-300 rounded-lg text-sm hidden">
                                </div>
                                <div><label class="block text-xs font-semibold text-slate-600 mb-1">型號</label><input type="text" id="cat1-model" placeholder="Hiace / Canter" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></div>
                                <div><label class="block text-xs font-semibold text-slate-600 mb-1">車牌</label><input type="text" id="cat1-plate" placeholder="AB1234" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-mono"></div>
                                <div><label class="block text-xs font-semibold text-slate-600 mb-1">底盤號碼 (VIN)</label><input type="text" id="cat1-vin" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-mono"></div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">出發地 *</label>
                                    <select id="cat1-origin-select" onchange="toggleCustomOption('cat1-origin-select', 'cat1-origin-custom')" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                        <option value="">-- 請選擇出發地 --</option>
                                        <option value="工場(八鄉)">工場(八鄉)</option>
                                        <option value="EMSD - 九龍灣 G/F">EMSD - 九龍灣 G/F</option>
                                        <option value="other">其他 (手動輸入)</option>
                                    </select>
                                    <input type="text" id="cat1-origin-custom" class="w-full mt-2 px-3 py-2 border border-slate-300 rounded-lg text-sm hidden">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">目的地 *</label>
                                    <select id="cat1-destination-select" onchange="toggleCustomOption('cat1-destination-select', 'cat1-destination-custom')" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                                        <option value="">-- 請選擇目的地 --</option>
                                        <option value="工場(八鄉)">工場(八鄉)</option>
                                        <option value="EMSD - 九龍灣 G/F">EMSD - 九龍灣 G/F</option>
                                        <option value="other">其他 (手動輸入)</option>
                                    </select>
                                    <input type="text" id="cat1-destination-custom" class="w-full mt-2 px-3 py-2 border border-slate-300 rounded-lg text-sm hidden">
                                </div>
                            </div>
                        </div>

                        <!-- 隨車物品點檢與車況 -->
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                            <h3 class="text-sm font-bold text-slate-800">第二部分：隨車物品與點檢</h3>
                            <div id="cat1-items-list" class="space-y-2">
                                <label class="flex items-center gap-2 bg-white p-2 rounded border"><input type="checkbox" checked data-item-name="車匙"> <span>車匙</span></label>
                            </div>
                        </div>

                        <div class="flex items-center justify-end">
                            <button type="submit" id="submit-btn" class="px-6 py-2.5 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition">確認完成並提交申報</button>
                        </div>
                    </div>
                </form>
            </div>
        </section>

        <!-- ==================== 主管後台端 (發布 Order + 審核) ==================== -->
        <section id="view-admin" class="space-y-6 hidden">
            <div id="admin-login-box" class="max-w-md mx-auto bg-white p-6 rounded-2xl border border-slate-200 text-center space-y-4">
                <h3 class="text-base font-bold">主管登入</h3>
                <input type="password" id="admin-pin" placeholder="PIN 碼" class="w-full text-center px-3 py-2 border rounded-xl">
                <button onclick="verifyAdminPin()" class="w-full py-2 bg-slate-900 text-white rounded-xl">登入</button>
            </div>

            <div id="admin-dashboard" class="space-y-6 hidden">
                <!-- 新增派單區域 -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
                    <h3 class="text-base font-bold text-slate-900 flex items-center gap-2"><i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i> 主管發布今日行程 (派單)</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div><label class="block text-xs font-semibold mb-1">預定日期時間 / 上下午</label><input type="text" id="dispatch-time" placeholder="例如：2026-09-16 上午 10:00" class="w-full p-2 border rounded-lg text-xs"></div>
                        <div><label class="block text-xs font-semibold mb-1">客人 / 部門</label><input type="text" id="dispatch-dept" placeholder="例如：機電工程署" class="w-full p-2 border rounded-lg text-xs"></div>
                        <div><label class="block text-xs font-semibold mb-1">預計車牌</label><input type="text" id="dispatch-plate" placeholder="例如：AB1234" class="w-full p-2 border rounded-lg text-xs font-mono"></div>
                        <div><label class="block text-xs font-semibold mb-1">出發地</label><input type="text" id="dispatch-origin" placeholder="例如：工場(八鄉)" class="w-full p-2 border rounded-lg text-xs"></div>
                        <div><label class="block text-xs font-semibold mb-1">目的地</label><input type="text" id="dispatch-dest" placeholder="例如：EMSD - 九龍灣" class="w-full p-2 border rounded-lg text-xs"></div>
                        <div><label class="block text-xs font-semibold mb-1">備註</label><input type="text" id="dispatch-notes" placeholder="例如：需帶工具" class="w-full p-2 border rounded-lg text-xs"></div>
                    </div>
                    <button onclick="dispatchNewOrder()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl flex items-center gap-1.5"><i data-lucide="send" class="w-4 h-4"></i> 發布行程並自動推送通知</button>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-slate-200 space-y-4">
                    <h3 class="text-base font-bold">已申報記錄列表</h3>
                    <div id="admin-report-list" class="space-y-3"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- 接單選取 modal -->
    <div id="accept-order-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full space-y-4">
            <h3 class="text-base font-bold text-slate-900">確認接單 (填寫 T 牌與姓名)</h3>
            <div>
                <label class="block text-xs font-semibold mb-1">T 牌號碼 *</label>
                <select id="accept-t-plate" class="w-full p-2 border rounded-lg text-xs">
                    <option value="T15195">T15195</option><option value="T11835">T11835</option><option value="T10559">T10559</option><option value="T13012">T13012</option><option value="T13013">T13013</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1">司機/員工姓名 *</label>
                <select id="accept-driver" class="w-full p-2 border rounded-lg text-xs">
                    <option value="林國枝">林國枝</option><option value="鄭偉倫">鄭偉倫</option><option value="黃家鑑">黃家鑑</option><option value="林耀銓">林耀銓</option>
                </select>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeAcceptModal()" class="px-4 py-2 border text-xs rounded-xl">取消</button>
                <button onclick="confirmAcceptOrder()" class="px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">撕單並接單</button>
            </div>
        </div>
    </div>

    <script>
        // 已填入你的 Firebase 專案配置
        const firebaseConfig = {
            apiKey: "AIzaSyAVSqdFFoepdwrRtxGjyoSBPwHlfxORGd8",
            authDomain: "newtech-system.firebaseapp.com",
            projectId: "newtech-system",
            storageBucket: "newtech-system.firebasestorage.app",
            messagingSenderId: "871887832252",
            appId: "1:871887832252:web:1f67972ce9ab9b7887fcb9",
            measurementId: "G-HTDDDS2755"
        };

        const GOOGLE_DRIVE_GAS_URL = 'https://script.google.com/macros/s/AKfycbzJNJjV_ZN4rfmrvENUhE3QEHN76tWiX8Q22BuAMysYJRToPguCf41ZGSo1JmIhkaT-ow/exec';

        let db = null, messaging = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            messaging = firebase.messaging();
        } catch(e) { console.error("Firebase 初始化失敗:", e); }

        let selectedOrderForAccept = null;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            listenToOrdersRealtime();
        });

        // FCM 推送權限
        function requestNotificationPermission() {
            Notification.requestPermission().then(permission => {
                if (permission === 'granted') {
                    alert('已成功訂閱新單推送通知！');
                }
            });
        }

        // 實時監聽今日派單
        function listenToOrdersRealtime() {
            if (!db) return;
            db.collection("daily_orders").onSnapshot(snapshot => {
                const container = document.getElementById('orders-container');
                container.innerHTML = '';
                snapshot.docs.forEach(doc => {
                    const order = { id: doc.id, ...doc.data() };
                    container.appendChild(renderOrderCard(order));
                });
                lucide.createIcons();
            });
        }

        // 渲染紙張記事本 Card
        function renderOrderCard(order) {
            const div = document.createElement('div');
            div.id = `order-card-${order.id}`;
            div.className = "tear-card paper-stack p-5 rounded-xl border border-slate-300 relative space-y-3";
            
            let statusBadge = `<span class="px-2 py-0.5 text-[10px] bg-amber-100 text-amber-800 rounded-full font-bold">待接單</span>`;
            if (order.status === 'accepted') statusBadge = `<span class="px-2 py-0.5 text-[10px] bg-blue-100 text-blue-800 rounded-full font-bold">已接單 (${order.driver})</span>`;
            if (order.status === 'completed') statusBadge = `<span class="px-2 py-0.5 text-[10px] bg-green-100 text-green-800 rounded-full font-bold">已完成</span>`;

            div.innerHTML = `
                <div class="flex justify-between items-start border-b border-dashed border-slate-300 pb-2">
                    <span class="text-xs font-bold text-slate-500 font-mono">${order.dispatch_time || '今日'}</span>
                    ${statusBadge}
                </div>
                <div class="space-y-1 text-xs">
                    <p><strong>部門：</strong> ${order.dept || '--'}</p>
                    <p><strong>預計車牌：</strong> <span class="font-mono font-bold">${order.plate || '--'}</span></p>
                    <p><strong>出發：</strong> ${order.origin}</p>
                    <p><strong>目的地：</strong> ${order.destination}</p>
                    <p class="text-slate-500"><strong>備註：</strong> ${order.notes || '無'}</p>
                </div>
                <div class="pt-2 border-t border-slate-200 flex justify-end">
                    ${order.status === 'pending' ? `<button onclick="openAcceptModal('${order.id}')" class="px-3 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700 shadow">撕單接單</button>` : ''}
                    ${order.status === 'accepted' ? `<button onclick="completeOrderAndNavigate('${order.id}')" class="px-3 py-1.5 bg-emerald-600 text-white text-xs font-bold rounded-lg hover:bg-emerald-700 shadow">完成 Order 並填報</button>` : ''}
                </div>
            `;
            return div;
        }

        function openAcceptModal(orderId) {
            selectedOrderForAccept = orderId;
            document.getElementById('accept-order-modal').classList.remove('hidden');
        }

        function closeAcceptModal() {
            document.getElementById('accept-order-modal').classList.add('hidden');
        }

        // 確認接單並觸發撕紙動畫
        async function confirmAcceptOrder() {
            const tPlate = document.getElementById('accept-t-plate').value;
            const driver = document.getElementById('accept-driver').value;
            closeAcceptModal();

            const card = document.getElementById(`order-card-${selectedOrderForAccept}`);
            if (card) card.classList.add('tear-animation');

            if (db) {
                await db.collection("daily_orders").doc(selectedOrderForAccept).update({
                    status: 'accepted',
                    t_plate: tPlate,
                    driver: driver
                });
            }
        }

        // 完成 Order 並跳轉申報
        async function completeOrderAndNavigate(orderId) {
            const doc = await db.collection("daily_orders").doc(orderId).get();
            const order = doc.data();

            document.getElementById('cat1-t-plate').value = order.t_plate || '';
            document.getElementById('cat1-driver-select').value = order.driver || '';
            document.getElementById('cat1-dept-select').value = order.dept || '';
            document.getElementById('cat1-plate').value = order.plate || '';
            document.getElementById('cat1-origin-select').value = order.origin || '';
            document.getElementById('cat1-destination-select').value = order.destination || '';

            switchTab('driver');
        }

        // 主管發布新單
        async function dispatchNewOrder() {
            const payload = {
                dispatch_time: document.getElementById('dispatch-time').value,
                dept: document.getElementById('dispatch-dept').value,
                plate: document.getElementById('dispatch-plate').value,
                origin: document.getElementById('dispatch-origin').value,
                destination: document.getElementById('dispatch-dest').value,
                notes: document.getElementById('dispatch-notes').value,
                status: 'pending',
                created_at: new Date().toISOString()
            };

            if (db) {
                await db.collection("daily_orders").add(payload);
                alert('派單成功，已即時同步至司機端記事本！');
            }
        }

        function switchTab(tab) {
            ['notebook', 'driver', 'admin'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
        }

        function verifyAdminPin() {
            if (document.getElementById('admin-pin').value === '28668966') {
                document.getElementById('admin-login-box').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
            }
        }

        function toggleCustomOption(sId, cId) {
            const s = document.getElementById(sId), c = document.getElementById(cId);
            if (s.value === 'other') c.classList.remove('hidden');
            else c.classList.add('hidden');
        }
    </script>
</body>
</html>
